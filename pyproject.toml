[project]
name = "homebase"
version = "0.5.0"
description = "Private household ledger: double-entry, receipt ingest, bank CSV reconciliation, and pantry inventory."
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homebase = "homebase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["homebase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
